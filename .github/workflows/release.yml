name: Release Build

on:
  # Can be triggered manually from the Actions tab for ad-hoc releases or testing.
  workflow_dispatch:
  # Auto-fire on every push for CI. The smoke-test matrix runs for all pushes;
  # final-release uploads an artifact so every push produces a downloadable build.
  push:

jobs:
  # Debug/Release x Win32/x64 smoke-test matrix — all four legs build in
  # parallel so CI reports each variant's status independently. These only
  # compile S3DDriver.sln; they don't produce a shippable artifact.
  smoke-test:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [Win32, x64]

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # Writes bin/temp_version.h from VERSION.txt + git SHA before any build.
      - name: Generate version header
        run: .\bin\generate_version.ps1

      - name: Build S3DDriver.sln
        run: msbuild S3DDriver.sln /p:Configuration="${{ matrix.configuration }}" /p:Platform=${{ matrix.platform }} /m /nologo /verbosity:minimal

  # Runs only after all four smoke-test legs succeed. Builds the shipped
  # Final Release config plus the proxy/NvDirectMode solutions, stages the
  # releases/ tree, and uploads it as the build artifact. 0.4.0+: Final
  # Release keeps zlog live (FinalRelease.props no longer defines
  # FINAL_RELEASE) so shipped artifacts carry DEBUG_MESSAGE / DEBUG_TRACE
  # output for field triage.
  final-release:
    needs: smoke-test
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # Writes bin/temp_version.h from VERSION.txt + git SHA before any build.
      - name: Generate version header
        run: .\bin\generate_version.ps1

      - name: Build S3DDriver.sln (Win32)
        run: msbuild S3DDriver.sln /p:Configuration="Final Release" /p:Platform=Win32 /m /nologo /verbosity:minimal

      - name: Build S3DDriver.sln (x64)
        run: msbuild S3DDriver.sln /p:Configuration="Final Release" /p:Platform=x64 /m /nologo /verbosity:minimal

      # Proxy solution only defines Debug/Release (no Final Release config).
      - name: Build wiz3D-proxy.sln (Release, Win32)
        run: msbuild wiz3D-proxy\wiz3D-proxy.sln /p:Configuration=Release /p:Platform=Win32 /m /nologo /verbosity:minimal

      - name: Build wiz3D-proxy.sln (Release, x64)
        run: msbuild wiz3D-proxy\wiz3D-proxy.sln /p:Configuration=Release /p:Platform=x64 /m /nologo /verbosity:minimal

      # NvDirectMode solution only defines Debug/Release (no Final Release config).
      - name: Build NvDirectMode.sln (Release, Win32)
        run: msbuild NvDirectMode\NvDirectMode.sln /p:Configuration=Release /p:Platform=Win32 /m /nologo /verbosity:minimal

      - name: Build NvDirectMode.sln (Release, x64)
        run: msbuild NvDirectMode\NvDirectMode.sln /p:Configuration=Release /p:Platform=x64 /m /nologo /verbosity:minimal

      # deploy_to_releases.ps1 with no -Arch defaults to 'both' and pairs
      # S3DDriver's Final Release output with the proxy's Release output for
      # both Win32 and x64 in one pass. ZLOg.dll ships with Final Release
      # since 0.4.0 (zlog is live in that config now).
      - name: Stage releases tree
        run: .\bin\deploy_to_releases.ps1

      # Mirrors the parse rule in bin/generate_version.ps1: strip any
      # "-suffix" (e.g. "0.2.4-rc1" -> "0.2.4") so the artifact name stays
      # in lockstep with the version baked into the DLLs.
      - name: Read version from VERSION.txt
        id: version
        shell: pwsh
        run: |
          $raw = (Get-Content -Raw VERSION.txt).Trim()
          $numeric = ($raw -split '-', 2)[0]
          "version=$numeric" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "wiz3D version: $numeric"

      - name: Upload combined release artifact
        # Single artifact, name pulled from VERSION.txt (e.g. wiz3D.v0.2.4).
        # SR-Native (Samsung Odyssey 3D Hub / LeiaSR passthrough) is built
        # locally only — its solution isn't in CI and its output includes
        # third-party SDK DLLs that can't ship from GitHub Actions. The
        # folder's wiz3D_Config.xml is tracked in git, so exclude the whole
        # subtree here.
        uses: actions/upload-artifact@v6
        with:
          name: wiz3D.v${{ steps.version.outputs.version }}
          path: |
            releases/
            !releases/wiz3D/SR-Native/**
          if-no-files-found: error
